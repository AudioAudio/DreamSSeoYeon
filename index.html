<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0d24">
<title>꿈꾸고이써연</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gothic+A1:wght@500;700;800&display=swap">
<style>
[hidden]{display:none!important}
html,body{margin:0}
*,*::before,*::after{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* Layout: fixed 9:16 portrait stage centered in the window; canvas + HUD inside.
   Art: assets/ (see README for the folder map). */
:root{
  --outside:#0b0d24;
  --sky:#2a2f6e;
  --ink:#ffffff;
  --card-ink:#2b2f86;
  --card-dim:#3f45a0;
  --accent:#ffd04a;
  --display:"Jua","Gothic A1","Apple SD Gothic Neo",system-ui,sans-serif;
  --body:"Gothic A1","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--outside);color:var(--ink);font-family:var(--body);overflow:hidden;
  display:flex;align-items:center;justify-content:center;box-sizing:border-box;
  padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-user-select:none;user-select:none;touch-action:manipulation}
.stage{position:relative;aspect-ratio:9/16;width:min(100%, calc((100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)) * 9 / 16));
  max-width:100%;border-radius:14px;overflow:hidden;background:var(--sky);container-type:size;
  box-shadow:0 0 0 1px rgba(255,255,255,.08),0 20px 60px rgba(0,0,0,.5)}
canvas{display:block;width:100%;height:100%;cursor:pointer}
.hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;
  padding:4cqw 4cqw 0;pointer-events:none}
/* score drawn with the digit sprites in assets/ui */
.digits{display:flex;align-items:flex-end;gap:0}
.digits img{height:100%;width:auto;margin-left:-.6cqw;filter:drop-shadow(0 .6cqw .8cqw rgba(30,30,100,.45))}
#score{height:17cqw}
.side{display:flex;flex-direction:column;align-items:flex-end;gap:1cqw}
.label{font-size:3.2cqw;letter-spacing:.1em;color:#fff;font-weight:800;text-shadow:0 0 1.2cqw rgba(30,30,90,.95)}
#best{height:8cqw}
.combo{position:absolute;left:50%;top:33%;transform:translateX(-50%);font-family:var(--display);color:var(--accent);
  font-size:8cqw;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;white-space:nowrap;
  -webkit-text-stroke:.6cqw #4a3fb0;paint-order:stroke fill}
.combo.show{opacity:1;transform:translateX(-50%) translateY(-2cqw)}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:0 3cqw}
/* panel from the game-over UI set; content sits inside the inner sky area (per the fixed mockup) */
.card{position:relative;width:100%;aspect-ratio:600/598;background:var(--panel) center/100% 100% no-repeat;
  display:flex;flex-direction:column;align-items:center;text-align:center;color:var(--card-ink);
  padding:17cqw 13cqw 0;gap:2.4cqw}
.card .logo{position:absolute;left:50%;top:-25cqw;width:78%;transform:translateX(-50%);filter:drop-shadow(0 1cqw 1.5cqw rgba(30,30,110,.4))}
.card.start{padding-top:31cqw}
.card h1{margin:0;font-family:var(--display);font-size:11cqw;font-weight:400;color:var(--card-ink);line-height:1.1;
  text-shadow:0 0 .8cqw #fff,0 0 1.6cqw #fff,0 0 2.4cqw rgba(255,255,255,.8)}
.card p{margin:0;color:var(--card-ink);line-height:1.5;font-size:3.6cqw;font-weight:800;text-shadow:0 0 1cqw rgba(255,255,255,.9)}
.card .big{height:19cqw;justify-content:center}
button{font-family:var(--display);font-size:6.2cqw;color:#fff;border:0;cursor:pointer;width:56cqw;aspect-ratio:480/124;
  background:var(--btn) center/100% 100% no-repeat transparent;-webkit-text-stroke:.6cqw #2d3aa6;paint-order:stroke fill;
  padding:0 0 0 12cqw;margin-top:1cqw}
button:active{background-image:var(--btn-pressed)}
button:focus-visible{outline:3px solid #fff;outline-offset:3px;border-radius:99px}
/* ---- ranking ---- */
.link{font-family:var(--display);font-size:4.4cqw;color:var(--card-ink);background:rgba(255,255,255,.72);border:.5cqw solid rgba(80,90,200,.35);
  border-radius:99px;padding:1.2cqw 5cqw;width:auto;aspect-ratio:auto;-webkit-text-stroke:0;margin-top:0}
.link:active{background:rgba(255,255,255,.95)}
.status{min-height:4.6cqw;font-size:3.4cqw!important;color:var(--card-dim)!important}
.status.fail{color:#c0396b!important;text-decoration:underline;cursor:pointer}
.card.tall{aspect-ratio:600/800;padding-top:15cqw;gap:1.8cqw}
.rank-list{list-style:none;margin:0;padding:0;width:100%;display:flex;flex-direction:column;gap:.8cqw}
.rank-list li{display:grid;grid-template-columns:7cqw minmax(0,1fr) auto;align-items:center;gap:1.5cqw;
  background:rgba(255,255,255,.62);border-radius:2.4cqw;padding:.9cqw 2.6cqw;font-weight:800;font-size:3.9cqw;color:var(--card-ink)}
.rank-list li.me{background:rgba(255,220,110,.85)}
.rank-list .no{font-family:var(--display);font-size:4.6cqw;color:#6a63c8;text-align:center}
.rank-list li:nth-child(1) .no{color:#e0a400}.rank-list li:nth-child(2) .no{color:#8a93b8}.rank-list li:nth-child(3) .no{color:#c27a4a}
.rank-list .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
.rank-list .sc{font-family:var(--display);font-size:4.6cqw;font-variant-numeric:tabular-nums}
.rank-empty{font-size:3.8cqw;font-weight:800;color:var(--card-dim);padding:6cqw 0;text-align:center;white-space:pre-line}
.rank-foot{display:flex;gap:2cqw;align-items:center;justify-content:center;flex-wrap:wrap}
.name-input{font:800 5cqw var(--body);width:100%;padding:2cqw 3cqw;border-radius:2.4cqw;border:.6cqw solid rgba(80,90,200,.45);
  background:#fff;color:var(--card-ink);text-align:center;outline:none}
.name-input:focus{border-color:#5a63d8}
.err{min-height:4.4cqw;color:#c0396b!important;font-size:3.4cqw!important}
.pre{white-space:pre-line}
#rankOv,#nameOv{background:rgba(16,18,60,.55)}
/* game over: everything sits inside the panel's inner sky (left/right 12%, top 18%, bottom 21%) */
.card.over{display:block;padding:0}
.card.over .inner{position:absolute;left:12%;right:12%;top:17%;bottom:19%;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:1cqw}
.card.over .inner > *{flex:none}
.card.over h1{font-size:8.6cqw}
.card.over .big{height:12cqw;flex:none}
.card.over #overMsg{font-size:3.3cqw;line-height:1.35;text-wrap:balance}
.card.over .status{font-size:3.1cqw!important;min-height:0;line-height:1.3;white-space:pre-line}
.card.over .status:empty{display:none}
.card.over #retryBtn{width:46cqw;font-size:5.4cqw;padding-left:10cqw;margin-top:.6cqw;flex:none}
.card.over .link{font-size:3.6cqw;padding:.7cqw 4cqw;flex:none}
</style>
</head>
<body>

<div class="stage" id="stage">
  <canvas id="cv" aria-label="꿈꾸고이써연 게임 화면"></canvas>
  <div class="hud">
    <div class="digits" id="score" role="img" aria-label="점수 0"></div>
    <div class="side"><span class="label">최고 기록</span><div class="digits" id="best" role="img" aria-label="최고 기록 0"></div></div>
  </div>
  <div class="combo" id="combo"></div>
  <div class="overlay" id="startOv">
    <div class="card start">
      <img class="logo" id="logo" alt="꿈꾸고이써연">
      <p>해냥이들이 침대를 들고 뛰어오를 때<br>그 아래로 블럭을 끼워 넣으세요.<br>내려와 있을 때 쏘면 부딪혀요.</p>
      <button id="startBtn">시작하기</button>
      <button class="link" id="startRank" type="button">랭킹 보기</button>
    </div>
  </div>
  <div class="overlay" id="overOv" hidden>
    <div class="card over"><div class="inner">
      <h1>게임 오버</h1>
      <div class="digits big" id="finalScore" role="img" aria-label="최종 점수"></div>
      <p id="overMsg">층 쌓았어요</p>
      <p class="status" id="rankStatus" role="status"></p>
      <button id="retryBtn">다시 하기</button>
      <button class="link" id="overRank" type="button">랭킹 보기</button>
    </div></div>
  </div>
  <div class="overlay" id="rankOv" hidden>
    <div class="card tall" role="dialog" aria-labelledby="rankTitle">
      <h1 id="rankTitle">랭킹</h1>
      <div id="rankBody" style="width:100%"></div>
      <div class="rank-foot">
        <button class="link" id="rankName" type="button">닉네임 정하기</button>
        <button class="link" id="rankClose" type="button">닫기</button>
      </div>
    </div>
  </div>
  <div class="overlay" id="nameOv" hidden>
    <form class="card" id="nameForm" autocomplete="off" role="dialog" aria-labelledby="nameTitle">
      <h1 id="nameTitle">랭킹 등록</h1>
      <p class="pre" id="nameMsg"></p>
      <input class="name-input" id="nameInput" type="text" maxlength="10" enterkeyhint="done" placeholder="닉네임 (최대 10자)" aria-label="닉네임">
      <p class="err" id="nameErr" role="alert"></p>
      <div class="rank-foot">
        <button class="link" id="nameSkip" type="button">건너뛰기</button>
        <button class="link" id="nameOk" type="submit" style="background:#ffd66b">등록</button>
      </div>
    </form>
  </div>
</div>

<script>
(() => {
  const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  const $ = id => document.getElementById(id);

  // ---------- coordinates (1080x1920 design = 360x640 world) ----------
  const VW = 360, VH = 640;
  const BH = 30;
  const END = 12;             // rounded end width of a block (world)
  const START_W = 190;
  const PERFECT = 5;
  const GROUND = VH - 110;
  const FOCUS_Y = 330;
  let scale = 1, dpr = 1;
  const FPS = { bump: 10, fx: 12 };

  // ---------- sprite measurements (measured from the PNGs in assets/characters) ----------
  // haenyangi frames: 120x120, sheet frames placed on their row's ground line.
  // FEET = bottom of the body (airborne frames keep their in-frame lift),
  // HEAD = top of the body in the middle columns (bed rests here).
  const H_FEET = { idle: 119, anticipate: 119, takeoff: 95, apex: 95, fall: 94, recover: 120, bump_1: 118, bump_2: 118, bump_3: 120 };
  const H_HEAD = { idle: 51, anticipate: 61, takeoff: 24, apex: 26, fall: 18, recover: 64, bump_1: 55, bump_2: 52, bump_3: 58 };
  // jump-trail fix v1: takeoff (with its lines/cloud puffs) only for the first ~5 frames of a jump,
  // then effect-free airborne frames (apex while rising/at the top, fall while coming down).
  const TAKEOFF_VY = -8.5;
  // Sseoyeon sleep/wake pictures include their own bed (341x251 after cut).
  const BED = { sleep: { file: 'characters/sseoyeon_sleep.png', bottom: 247, cx: 171 },
                wake:  { file: 'characters/sseoyeon_wake.png',  bottom: 247, cx: 170 } };
  const BED_W = 158;                     // fixed world width, never stretched to the tower
  const STRIP_FLOOR = 60;                // cloud-strip top row the tower stands on

  // ---------- assets ----------
  const url = p => (window.ASSET_DATA && window.ASSET_DATA[p]) || 'assets/' + p;
  const IMG = {};
  const load = p => { const im = new Image(); im.src = url(p); IMG[p] = im; };
  for (let c = 1; c <= 8; c++) load(`blocks/block_0${c}.png`);
  for (const s of Object.keys(H_FEET)) load(`characters/haenyangi_${s}.png`);
  load(BED.sleep.file); load(BED.wake.file);
  // calm background pack v1, standard (non-loop) versions — pinned, so no tiling
  for (const s of ['bg_01', 'bg_02', 'bg_03']) load(`backgrounds/${s}.jpg`);
  load('backgrounds/ground_clouds.png');
  // [file prefix, frames, size (world), fps]. PERFECT uses the dedicated text-burst sheet (guide: 8 frames, 10fps, once, ~0.8s).
  const FX_DEF = { perfect: ['effects/fx_perfect_', 8, 175, 10], impact: ['effects/fx_block_impact_', 6, 62, 12], dust: ['effects/fx_land_dust_', 6, 46, 12] };
  for (const k in FX_DEF) for (let f = 0; f < FX_DEF[k][1]; f++) load(`${FX_DEF[k][0]}${f}.png`);
  const ok = im => im && im.complete && im.naturalWidth > 0;
  const stageEl = $('stage');
  stageEl.style.setProperty('--panel', `url("${url('ui/panel.png')}")`);
  stageEl.style.setProperty('--btn', `url("${url('ui/button_normal.png')}")`);
  stageEl.style.setProperty('--btn-pressed', `url("${url('ui/button_pressed.png')}")`);
  $('logo').src = url('ui/logo.png');

  // ---------- online ranking (Cloudflare Worker, same flow as Lulucy's Flight) ----------
  // POST /score {name, score} → { ok, rank }   GET /top → [{name, score}] top 10
  // Submitted once per game over, only when this score beats the best this device already sent.
  const RANK_API = 'https://kkranking.jinthesurge.workers.dev';
  const NAME_MAX = 10;
  const store = { get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } },
                  set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} } };
  // nickname filter: Lulucy's Flight tools/nickname_filter.js (same list on the server)
  // Lulucy's Flight 닉네임 필터 (게임·서버 공용으로 쓸 수 있게 독립 함수로 작성)
  // checkNickname(name) → { ok: true } | { ok: false, reason: 'empty'|'long'|'banned'|'reserved' }
  const NICK = (() => {
    // 한글 비속어·혐오 표현 (자모 단위로 비교 → 자모 분리·쌍자음 우회도 잡음)
    const KO = ['시발', '씨발', '씨바', '시바알', '씨빨', '시빨', '씌발', '쓰발', '쓰바', '쉬발', '슈발', '시팔', '씨팔', '씨펄', '십발', '십팔놈', '십새',
      '씹', '좆', '좃같', '존나', '졸라', '존니', '병신', '븅신', '빙신', '병싄', '등신', '머저리',
      '개새', '개색', '개세끼', '새끼', '새기', '색기', '섀끼', '쌔끼', '개같', '개년', '개놈', '개자식', '개잡', '개소리', '개씹',
      '썅', '쌍년', '쌍놈', '썅년', '썅놈', '걸레년', '창녀', '창년', '화냥', '갈보',
      '니미', '느금', '니애미', '니앰', '느그애미', '애미', '애비', '엄창', '엠창', '니엄마', '느개비',
      '지랄', '염병', '옘병', '엿먹', '꺼져', '닥쳐', '닥치', '뒤져', '뒈져', '디져', '죽어라', '자살',
      '미친놈', '미친년', '미친새', '또라이', '돌아이', '정신병자', '찐따', '쓰레기새',
      '섹스', '쎅스', '섹1스', '보지', '자지', '잠지', '보짓', '자짓', '젖꼭', '딸딸', '자위', '야동', '포르노', '강간', '성폭', '몸캠', '조건만남', '원조교제',
      '한남충', '한녀', '김치녀', '된장녀', '맘충', '틀딱', '급식충', '일베', '메갈', '워마드', '흑형', '짱깨', '쪽발', '쪽바리',
      '마약', '대마초', '필로폰', '도박'];
    // 초성·자음 축약 (입력한 자음이 연달아 있을 때만 검사 → '갓불' 같은 정상 단어는 통과)
    const CHO = ['ㅅㅂ', 'ㅆㅂ', 'ㅄ', 'ㅂㅅ', 'ㅈㄹ', 'ㅈㄴ', 'ㄲㅈ', 'ㄷㅊ', 'ㅁㅊ', 'ㄴㄱㅁ', 'ㅅㅂㄹㅁ', 'ㅆㄹㄱ', 'ㅈ같', 'ㅗ'];
    // 영어 (긴 단어는 부분 일치, 짧아서 다른 단어 속에 흔한 것은 이름 전체가 그 단어일 때만)
    const EN_SUB = ['fuck', 'fuk', 'fck', 'shit', 'bitch', 'asshole', 'cunt', 'nigger', 'nigga', 'faggot', 'motherf', 'whore', 'slut', 'porn', 'pussy', 'penis', 'vagina', 'dildo', 'hitler', 'nazi', 'retard', 'bastard', 'sibal', 'ssibal', 'shibal', 'byungsin', 'gaesaekki'];
    const EN_WORD = ['sex', 'dick', 'cock', 'rape', 'fag', 'tits', 'anal', 'stfu', 'wtf', 'kys', 'cum', 'jot', 'jiral'];
    // 숫자·영문을 섞은 한글 욕 우회
    const MIX = ['c발', 'c8', 'ㅅ8', 'ㅆ8', '씨8', '시8', '18놈', '18년', '개18', 'ㅅ1ㅂ', 'ㅆ1ㅂ', 'tlqkf', 'qudtls', 'wlfkf', 'whssk', 'rotoRl'.toLowerCase()];
    // 운영진 사칭 방지
    const RESERVED = ['관리자', '운영자', '운영진', '개발자', '공지사항', '시스템', 'admin', 'administrator', 'moderator', 'system', 'official', 'soop', '숲운영', '아프리카tv'];
    // 정상 단어 속에 우연히 들어간 경우 허용 (검사 전에 지움)
    const ALLOW = ['시발점', '시발역', '시발택시', '새끼손가락', '새끼발가락', '보지마', '보지않', '안보지', '애비뉴', '니미츠', '개새우', '졸라맨', '자지러', '시바견', '시바이누'];

    const L = 'ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ', V = 'ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ',
      T = ['', 'ㄱ', 'ㄲ', 'ㄳ', 'ㄴ', 'ㄵ', 'ㄶ', 'ㄷ', 'ㄹ', 'ㄺ', 'ㄻ', 'ㄼ', 'ㄽ', 'ㄾ', 'ㄿ', 'ㅀ', 'ㅁ', 'ㅂ', 'ㅄ', 'ㅅ', 'ㅆ', 'ㅇ', 'ㅈ', 'ㅊ', 'ㅋ', 'ㅌ', 'ㅍ', 'ㅎ'];
    const SOFT = { 'ㄲ': 'ㄱ', 'ㄸ': 'ㄷ', 'ㅃ': 'ㅂ', 'ㅆ': 'ㅅ', 'ㅉ': 'ㅈ', 'ㅢ': 'ㅣ', 'ㅟ': 'ㅣ', 'ㅝ': 'ㅓ', 'ㅞ': 'ㅔ', 'ㅙ': 'ㅐ', 'ㅚ': 'ㅐ', 'ㅖ': 'ㅔ', 'ㅒ': 'ㅐ' };
    const LEET = { '0': 'o', '1': 'i', '!': 'i', '3': 'e', '4': 'a', '@': 'a', '5': 's', '$': 's', '7': 't', '+': 't' };
    const jamo = s => [...s].map(c => {
      const k = c.charCodeAt(0) - 0xAC00;
      if (k < 0 || k > 11171) return SOFT[c] || c;
      const t = T[k % 28], j = L[Math.floor(k / 588)] + V[Math.floor(k % 588 / 28)] + t;
      return [...j].map(x => SOFT[x] || x).join('');
    }).join('');
    // NFKC는 전각·특수 문자를 정리하지만 한글 자음(ㅅ)을 조합용 자모로 바꿔 버리므로 한글 자모는 그대로 둠
    const base = s => [...s].map(c => /[\u3131-\u318E\uAC00-\uD7A3]/.test(c) ? c : c.normalize('NFKC')).join('').toLowerCase();
    const keepKo = s => s.replace(/[^가-힣ㄱ-ㅎㅏ-ㅣa-z]/g, '');                      // 숫자·기호·공백 제거
    const keepAll = s => s.replace(/[^가-힣ㄱ-ㅎㅏ-ㅣa-z0-9]/g, '');                 // 숫자는 남김(c8 같은 우회용)
    const strip = (s, list) => list.reduce((a, w) => a.split(w).join(''), s);
    const KO_J = KO.map(w => jamo(w)), CHO_N = CHO.map(w => [...w].map(x => SOFT[x] || x).join(''));

    function check(raw) {
      const name = String(raw ?? '').replace(/\s+/g, ' ').trim();
      if (!name) return { ok: false, reason: 'empty' };
      const b = base(name);
      const ko = strip(keepKo(b), ALLOW), mix = strip(keepAll(b), ALLOW);
      const en = keepKo([...b].map(c => LEET[c] || c).join(''));                    // 영어는 leet 치환 후 비교
      if (RESERVED.some(w => { const r = keepKo(base(w)); return r && (ko.includes(r) || mix.includes(keepAll(base(w))) || en.includes(r)); })) return { ok: false, reason: 'reserved' };
      const kj = jamo(ko);
      if (KO_J.some(w => kj.includes(w))) return { ok: false, reason: 'banned' };
      const choOnly = [...ko].map(x => SOFT[x] || x).join('');
      if (CHO_N.some(w => choOnly.includes(w))) return { ok: false, reason: 'banned' };
      if (MIX.some(w => mix.includes(w))) return { ok: false, reason: 'banned' };
      if (EN_SUB.some(w => en.includes(w))) return { ok: false, reason: 'banned' };
      const words = b.split(/[^a-z0-9]+/).filter(Boolean).map(w => keepKo([...w].map(c => LEET[c] || c).join('')));
      if (EN_WORD.some(w => en === w || words.includes(w))) return { ok: false, reason: 'banned' };
      if ([...name].length > 10) return { ok: false, reason: 'long' };          // 길이는 마지막에(표시용 검사에서 금칙어 여부를 먼저 판단)
      return { ok: true };
    }
    return { check };
  })();
  const rk = { name: (n => n && NICK.check(n).ok ? n : '')(store.get('kkisy-name') || ''),
    sent: +store.get('kkisy-rank-sent') || 0, status: '', rank: 0, pendingScore: 0, list: null, loading: false, err: '', why: '', dlg: null };
  function fetchT(u, opt = {}, ms = 7000) {
    const c = new AbortController(), id = setTimeout(() => c.abort(), ms);
    return fetch(u, { ...opt, signal: c.signal }).finally(() => clearTimeout(id));
  }
  function errWhy(e) {
    const m = String(e && e.message || e);
    if (e && e.name === 'AbortError') return '7초 동안 응답이 없었어요';
    if (/^HTTP \d+/.test(m)) return '서버 응답 ' + m.replace('HTTP ', '');
    if (m === 'format') return '응답 형식이 맞지 않아요';
    return navigator.onLine === false ? '인터넷 연결을 확인해 주세요' : '랭킹 서버에 연결하지 못했어요';
  }
  const shownName = n => { n = String(n ?? '').trim().slice(0, 16); return !n ? '???' : ['banned', 'reserved'].includes(NICK.check(n).reason) ? '(가려진 닉네임)' : n; };

  function renderStatus() {
    const el = $('rankStatus'); el.className = 'status';
    el.textContent = { sending: '랭킹에 등록하는 중…', sent: rk.rank ? `랭킹 ${rk.rank}위로 등록했어요` : '랭킹에 등록했어요',
      fail: `등록 실패 · 눌러서 다시 시도\n(${rk.why})`, skipped: '이번 기록은 랭킹에 올리지 않았어요' }[rk.status] || '';
    if (rk.status === 'fail') el.classList.add('fail');
  }
  async function rankSubmit(sc) {
    rk.status = 'sending'; rk.pendingScore = sc; renderStatus();
    try {
      const r = await fetchT(RANK_API + '/score', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: rk.name, score: sc }) });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const j = await r.json().catch(() => ({}));
      rk.status = 'sent'; rk.rank = +j.rank || 0; rk.list = null;
      if (sc > rk.sent) { rk.sent = sc; store.set('kkisy-rank-sent', String(sc)); }
    } catch (e) { rk.status = 'fail'; rk.why = errWhy(e); console.warn('[꿈꾸고이써연] 랭킹 등록 실패:', e); }
    renderStatus();
  }
  function rankAfterGameOver(sc) {
    if (sc > 0 && sc > rk.sent) { if (rk.name) rankSubmit(sc); else askName('submit', sc); }
  }

  function renderRank() {
    const b = $('rankBody');
    if (rk.loading) { b.innerHTML = '<p class="rank-empty">불러오는 중…</p>'; }
    else if (rk.err) {
      b.innerHTML = '';
      const p = document.createElement('p'); p.className = 'rank-empty'; p.textContent = rk.err + '\n' + rk.why;
      const btn = document.createElement('button'); btn.className = 'link'; btn.type = 'button'; btn.textContent = '다시 시도';
      btn.addEventListener('click', rankLoad);
      b.append(p, btn); b.style.textAlign = 'center';
    } else if (rk.list && rk.list.length) {
      const ol = document.createElement('ol'); ol.className = 'rank-list';
      rk.list.forEach((e, i) => {
        const li = document.createElement('li'); if (rk.name && e.name === rk.name) li.className = 'me';
        const no = document.createElement('span'); no.className = 'no'; no.textContent = i + 1;
        const nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = e.name;
        const sc = document.createElement('span'); sc.className = 'sc'; sc.textContent = e.score + '층';
        li.append(no, nm, sc); ol.append(li);
      });
      b.replaceChildren(ol);
    } else b.innerHTML = '<p class="rank-empty">아직 등록된 기록이 없어요.\n첫 번째 주인공이 되어 보세요!</p>';
    $('rankName').textContent = rk.name ? `닉네임: ${rk.name} · 변경` : '닉네임 정하기';
  }
  async function rankLoad() {
    rk.loading = true; rk.err = ''; renderRank();
    try {
      const r = await fetchT(RANK_API + '/top');
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const j = await r.json(); if (!Array.isArray(j)) throw new Error('format');
      rk.list = j.slice(0, 10).map(e => ({ name: shownName(e?.name), score: Math.max(0, Math.floor(Number(e?.score) || 0)) }));
    } catch (e) { rk.err = '랭킹을 불러오지 못했어요'; rk.why = errWhy(e); console.warn('[꿈꾸고이써연] 랭킹 불러오기 실패:', e); }
    rk.loading = false; renderRank();
  }
  function openRanking() { $('rankOv').hidden = false; rankLoad(); }
  function closeRanking() { $('rankOv').hidden = true; }

  function askName(reason, sc) {
    rk.dlg = { reason, sc };
    $('nameMsg').textContent = reason === 'submit' ? `이번 기록 ${sc}층을 랭킹에 올려요.\n랭킹에 표시할 닉네임을 정해 주세요.` : '랭킹에 표시할 닉네임을 정해 주세요.\n다음 기록부터 적용돼요.';
    $('nameSkip').textContent = reason === 'submit' ? '건너뛰기' : '취소';
    $('nameInput').value = rk.name; $('nameErr').textContent = ''; $('nameOv').hidden = false;
    setTimeout(() => { try { $('nameInput').focus(); $('nameInput').select(); } catch (e) {} }, 50);
  }
  function closeName() { $('nameOv').hidden = true; rk.dlg = null; $('nameInput').blur(); }
  $('nameForm').addEventListener('submit', e => {
    e.preventDefault();
    const v = $('nameInput').value.replace(/\s+/g, ' ').trim();
    const chk = NICK.check(v);
    if (!chk.ok) {
      $('nameErr').textContent = { empty: '닉네임을 입력해 주세요', long: `닉네임은 ${NAME_MAX}자까지 쓸 수 있어요`,
        banned: '사용할 수 없는 표현이 들어 있어요', reserved: '운영진으로 오해할 수 있는 닉네임은 쓸 수 없어요' }[chk.reason];
      $('nameInput').focus(); return;
    }
    rk.name = v; store.set('kkisy-name', v);
    const d = rk.dlg; closeName(); renderRank();
    if (d && d.reason === 'submit') rankSubmit(d.sc);
  });
  $('nameSkip').addEventListener('click', () => {
    const d = rk.dlg; closeName();
    if (d && d.reason === 'submit') { rk.status = 'skipped'; renderStatus(); }
  });
  $('nameInput').addEventListener('input', () => { $('nameErr').textContent = ''; });
  $('rankStatus').addEventListener('click', () => { if (rk.status === 'fail') rankSubmit(rk.pendingScore); });
  $('startRank').addEventListener('click', openRanking);
  $('overRank').addEventListener('click', openRanking);
  $('rankClose').addEventListener('click', closeRanking);
  $('rankName').addEventListener('click', () => askName('change'));
  $('rankOv').addEventListener('pointerdown', e => { if (e.target === $('rankOv')) closeRanking(); });

  // score digits from the UI kit
  function setDigits(el, n, label) {
    el.replaceChildren(...String(n).split('').map(d => { const i = new Image(); i.src = url(`ui/digit_${d}.png`); i.alt = ''; return i; }));
    el.setAttribute('aria-label', label + ' ' + n);
  }

  let stack, cur, debris, cam, camTarget, score, combo, state, colorBase, flash, cap, fx, overT;
  // background stage per atlas stageRange: 0–29F, 30–69F, 70F+; 0.8s cross-fade on change
  const BG_KEYS = ['backgrounds/bg_01.jpg', 'backgrounds/bg_02.jpg', 'backgrounds/bg_03.jpg'];
  const BG_FADE = 48;
  const stageOf = f => (f >= 70 ? 2 : f >= 30 ? 1 : 0);
  let bgFrom = 0, bgTo = 0, bgT = BG_FADE;
  const BASE = 2;
  let best = 0;
  try { best = +localStorage.getItem('stackBest') || 0; } catch (e) {}
  setDigits($('best'), best, '최고 기록');

  // Render resolution is fixed at 720x1280 (9:16) regardless of device or screen density,
  // like Lulucy's Flight. Game coordinates stay 360x640 (drawn at 2x); CSS scales the canvas to fit.
  const RENDER_W = 720, RENDER_H = 1280;
  function resize() {
    dpr = 1; scale = RENDER_W / VW;
    if (cv.width !== RENDER_W || cv.height !== RENDER_H) { cv.width = RENDER_W; cv.height = RENDER_H; }
  }

  const colorIdx = i => ((colorBase + i) % 8) + 1;
  const blockTop = i => GROUND - (i + 1) * BH;

  function reset() {
    colorBase = Math.floor(Math.random() * 8);
    stack = [];
    for (let k = 0; k < BASE; k++) stack.push({ x: (VW - START_W) / 2, w: START_W });
    cap = { x: (VW - START_W) / 2, w: START_W, tx: (VW - START_W) / 2, tw: START_W, dy: 0, vy: 0, resting: true, squash: 0, reveal: BH, wait: 40 };
    debris = []; fx = []; score = 0; combo = 0; flash = 0; overT = -1;
    cam = camTarget = 0;
    bgFrom = bgTo = 0; bgT = BG_FADE;
    setDigits($('score'), 0, '점수');
    spawn();
  }

  function spawn() {
    const top = stack[stack.length - 1];
    const fromLeft = stack.length % 2 === 0;
    const speed = Math.min(2 + stack.length * 0.11, 6.8);
    cur = { x: fromLeft ? -top.w : VW, w: top.w, dir: fromLeft ? 1 : -1, speed };
  }

  function updateCamera() { camTarget = Math.max(0, FOCUS_Y - blockTop(stack.length)); }
  const addFx = (kind, x, y) => fx.push({ kind, x, y, t: 0 });

  function drop() {
    if (state !== 'play') return;
    const top = stack[stack.length - 1];
    const i = stack.length;
    let { x, w } = cur;
    if (!gapOpen()) {
      debris.push({ x, w, i, vy: -3, vx: cur.dir * 2, rot: 0, vr: cur.dir * 0.06 });
      addFx('impact', x + w / 2, blockTop(i) + BH / 2);
      cap.squash = 1;
      return gameOver('해냥이들과 부딪혔어요!');
    }
    if (Math.abs(x - top.x) <= PERFECT) {
      x = top.x; combo++;
      flash = 1;
      if (combo > 1) showCombo(`COMBO ×${combo}`);       // PERFECT itself is the sprite animation
      if (combo >= 3) { const g = Math.min(10, START_W - w); x -= g / 2; w += g; }
    } else {
      combo = 0;
      const L = Math.max(x, top.x), R = Math.min(x + w, top.x + top.w);
      if (R <= L) {
        debris.push({ x, w, i, vy: 0, vx: cur.dir * 1.5, rot: 0, vr: cur.dir * 0.03 });
        return gameOver('완전히 빗나갔어요!');
      }
      if (x < L) debris.push({ x, w: L - x, i, vy: 0, vx: -1.2, rot: 0, vr: -0.04 });
      if (x + w > R) debris.push({ x: R, w: x + w - R, i, vy: 0, vx: 1.2, rot: 0, vr: 0.04 });
      x = L; w = R - L;
    }
    stack.push({ x, w });
    if (combo > 0) { addFx('perfect', VW / 2, 0); addFx('impact', x + w / 2, blockTop(i) + BH / 2); }
    else addFx('impact', x + w / 2, blockTop(i) + BH / 2);
    cap.dy += BH; cap.reveal = BH;
    cap.tx = x; cap.tw = w;
    score = stack.length - BASE;
    setDigits($('score'), score, '점수');
    updateCamera();
    spawn();
  }

  let comboTimer;
  function showCombo(t) {
    const el = $('combo'); el.textContent = t; el.classList.add('show');
    clearTimeout(comboTimer); comboTimer = setTimeout(() => el.classList.remove('show'), 700);
  }

  const gapOpen = () => !cap.resting && cap.dy <= -BH * 0.85;

  function gameOver(reason) {
    state = 'over'; cur = null; overT = 0;
    rk.status = ''; rk.rank = 0; renderStatus();
    const isBest = score > best;
    if (isBest) { best = score; try { localStorage.setItem('stackBest', best); } catch (e) {} }
    setDigits($('best'), best, '최고 기록');
    setDigits($('finalScore'), score, '최종 점수');
    $('overMsg').textContent = reason + ' ' + (isBest ? '새 최고 기록이에요!' : `${score}층 쌓았어요`);
    const sc = score;
    setTimeout(() => { $('overOv').hidden = false; rankAfterGameOver(sc); }, 900);
  }

  function update() {
    if (cur) {
      cur.x += cur.dir * cur.speed;
      if (cur.x > VW - cur.w * 0.15 && cur.dir > 0) cur.dir = -1;
      if (cur.x < -cur.w * 0.85 && cur.dir < 0) cur.dir = 1;
    }
    cam += (camTarget - cam) * 0.1;
    if (cap.resting) {
      if (state !== 'over' && --cap.wait <= 0) { cap.resting = false; cap.vy = -9.8; }
    } else {
      cap.vy += Math.abs(cap.vy) < 2.9 ? 0.106 : 0.265; cap.dy += cap.vy;
      if (cap.vy > 0 && cap.dy >= 0) {
        cap.dy = 0; cap.vy = 0; cap.resting = true; cap.squash = 1;
        cap.wait = 22;
        const feet = blockTop(stack.length) + BH, half = Math.min(Math.max(cap.w, 56), 196) / 2 - 10;
        addFx('dust', cap.x + cap.w / 2 - half, feet - 10);
        addFx('dust', cap.x + cap.w / 2 + half, feet - 10);
      }
    }
    cap.x += (cap.tx - cap.x) * 0.25; cap.w += (cap.tw - cap.w) * 0.25;
    cap.squash *= 0.9;
    cap.reveal = Math.max(cap.reveal, BH - Math.max(0, cap.dy));
    for (const d of debris) { d.vy += 0.5; d.dy = (d.dy || 0) + d.vy; d.x += d.vx; d.rot += d.vr; }
    debris = debris.filter(d => d.dy < VH + 400);
    for (const f of fx) f.t++;
    fx = fx.filter(f => f.t < FX_LEN[f.kind]);
    if (overT >= 0) overT++;
    flash *= 0.9;
  }

  // ---------- drawing ----------
  // Block = rounded left end + centre section + rounded right end, all taken from one
  // pre-joined strip per colour (the art pieces each had closed borders, so they were
  // trimmed and cross-faded into a strip at build time). Narrow blocks shrink the ends.
  function drawBlock(x, y, w, i, alpha = 1) {
    const S = IMG[`blocks/block_0${colorIdx(i)}.png`];
    ctx.globalAlpha = alpha;
    if (!ok(S)) { ctx.fillStyle = '#8fb4ff'; ctx.fillRect(x, y, w, BH); ctx.globalAlpha = 1; return; }
    const k = S.naturalHeight / BH;                 // source px per world unit
    const sw = S.naturalWidth / k;                  // strip length in world units
    const e = Math.min(END, w / 2);
    const mid = Math.min(w - 2 * e, sw - 2 * END);
    ctx.drawImage(S, 0, 0, e * k, S.naturalHeight, x, y, e, BH);
    ctx.drawImage(S, S.naturalWidth - e * k, 0, e * k, S.naturalHeight, x + w - e, y, e, BH);
    if (w - 2 * e > 0.01) {
      // centre section from the middle of the strip; stretched only if wider than the strip
      const sx = (sw - mid) / 2;
      ctx.drawImage(S, sx * k, 0, mid * k, S.naturalHeight, x + e - 0.2, y, w - 2 * e + 0.4, BH);
    }
    ctx.globalAlpha = 1;
  }

  function drawAim() {
    const y = blockTop(stack.length), x = cur.x, w = cur.w;
    ctx.save();
    const open = gapOpen();
    ctx.fillStyle = open ? 'rgba(120,255,190,.22)' : 'rgba(255,255,255,.14)';
    ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, BH, 9) : ctx.rect(x, y, w, BH); ctx.fill();
    ctx.setLineDash([7, 5]); ctx.lineDashOffset = -performance.now() / 40;
    ctx.strokeStyle = open ? 'rgba(110,250,185,1)' : 'rgba(255,255,255,.9)'; ctx.lineWidth = 2.2;
    ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x + 1, y + 1, w - 2, BH - 2, 9) : ctx.rect(x + 1, y + 1, w - 2, BH - 2); ctx.stroke();
    ctx.restore();
  }

  // physics state → haenyangi frame
  function pose() {
    if (overT >= 0) return 'bump_' + Math.min(3, 1 + Math.floor(overT * FPS.bump / 60));
    if (!cap.resting) return cap.vy < TAKEOFF_VY ? 'takeoff' : cap.vy < 2.9 ? 'apex' : 'fall';
    if (cap.squash > 0.2) return 'recover';
    if (cap.wait <= 7) return 'anticipate';
    return 'idle';
  }

  // Cap = haenyangi row + Sseoyeon-with-bed picture, all sharing cap.dy.
  // Collision stays cap.x/cap.w/BH; the art overhangs it.
  function drawCap() {
    const feet = blockTop(stack.length) + cap.dy + BH;
    const cx = cap.x + cap.w / 2;
    const p = pose();
    const H = IMG[`characters/haenyangi_${p}.png`];
    const HS = 56;                                   // drawn frame size (world); big enough to read under the bed
    const spread = Math.min(Math.max(cap.w, HS), 196);
    const n = Math.max(1, Math.min(5, Math.round(spread / 40)));
    const span = n > 1 ? spread - HS * 0.8 : 0;
    const hs = HS / 120;
    const top = feet - H_FEET[p] * hs;               // frame top so the body's feet sit on `feet`

    ctx.save();
    ctx.translate(cx, feet);
    ctx.scale(1 + cap.squash * 0.03, 1 - cap.squash * 0.04);
    ctx.translate(-cx, -feet);
    if (ok(H)) for (let k = 0; k < n; k++) {
      const hx = n > 1 ? cx - span / 2 + span * k / (n - 1) : cx;
      ctx.drawImage(H, hx - HS / 2, top, HS, HS);
    }
    const bed = overT >= 0 ? BED.wake : BED.sleep;
    const B = IMG[bed.file];
    const head = top + H_HEAD[p] * hs;
    if (ok(B)) {
      const s = BED_W / B.naturalWidth;
      ctx.drawImage(B, cx - bed.cx * s, head + 6 - bed.bottom * s, B.naturalWidth * s, B.naturalHeight * s);
    }
    ctx.restore();
  }

  const PERFECT_Y = 140;   // screen y of the PERFECT burst centre
  const FX_LEN = {}; for (const k in FX_DEF) FX_LEN[k] = Math.ceil(FX_DEF[k][1] * 60 / FX_DEF[k][3]);
  function drawFx() {
    for (const f of fx) {
      const [pre, n, size, fps] = FX_DEF[f.kind];
      const im = IMG[pre + Math.min(n - 1, Math.floor(f.t * fps / 60)) + '.png'];
      let y = f.y;
      // PERFECT sits near the score, fixed on screen just under the HUD (clear of the bouncing bed)
      if (f.kind === 'perfect') y = PERFECT_Y - cam;
      if (ok(im)) ctx.drawImage(im, f.x - size / 2, y - size / 2, size, size);
    }
  }

  const smooth = (a, b, v) => { const t = Math.min(1, Math.max(0, (v - a) / (b - a))); return t * t * (3 - 2 * t); };
  // backgrounds are single pictures (not vertical loops): pinned to the screen, cross-faded by stage.
  function drawScene(im, alpha) {
    if (alpha <= 0 || !ok(im)) return;
    ctx.globalAlpha = alpha; ctx.drawImage(im, 0, 0, VW, VH); ctx.globalAlpha = 1;
  }

  function render() {
    ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
    ctx.imageSmoothingQuality = 'high';
    ctx.fillStyle = '#2a2f6e'; ctx.fillRect(0, 0, VW, VH);
    // cloud village 0–29F → rainbow cloud kingdom 30–69F → star castle 70F+
    const st = stageOf(score);
    if (st !== bgTo) { bgFrom = bgTo; bgTo = st; bgT = 0; }
    if (bgT < BG_FADE) bgT++;
    drawScene(IMG[BG_KEYS[bgFrom]], 1);
    drawScene(IMG[BG_KEYS[bgTo]], smooth(0, BG_FADE, bgT));

    ctx.translate(0, cam);

    // ground: bottom cloud strip from the game-over UI set; scrolls off as the camera climbs
    const G = IMG['backgrounds/ground_clouds.png'];
    if (ok(G) && GROUND - 60 + cam < VH + 10) {
      const gw = 650, s = gw / G.naturalWidth, gh = G.naturalHeight * s;
      const gy = GROUND + 6 - STRIP_FLOOR * s;
      ctx.fillStyle = '#2d67f7'; ctx.fillRect(0, gy + gh - 4, VW, 400);
      ctx.drawImage(G, (VW - gw) / 2, gy, gw, gh);
    }

    stack.forEach((b, i) => {
      if (i === stack.length - 1 && i >= BASE && cap.reveal < BH) {
        ctx.save();
        ctx.beginPath(); ctx.rect(b.x - 10, blockTop(i) + BH - cap.reveal, b.w + 20, cap.reveal); ctx.clip();
        drawBlock(b.x, blockTop(i) + BH - cap.reveal, b.w, i);
        ctx.restore();
      } else drawBlock(b.x, blockTop(i), b.w, i);
    });
    if (flash > 0.05) {
      const t = stack[stack.length - 1], i = stack.length - 1, k = 1 - flash;
      ctx.strokeStyle = `rgba(255,240,180,${flash})`; ctx.lineWidth = 3;
      ctx.strokeRect(t.x - 12 * k, blockTop(i) - 12 * k, t.w + 24 * k, BH + 24 * k);
    }
    drawCap();
    if (cur) drawAim();

    for (const d of debris) {
      ctx.save();
      ctx.translate(d.x + d.w / 2, blockTop(d.i) + d.dy + BH / 2);
      ctx.rotate(d.rot);
      drawBlock(-d.w / 2, -BH / 2, d.w, d.i, 0.9);
      ctx.restore();
    }
    drawFx();
  }

  function loop() { update(); render(); requestAnimationFrame(loop); }

  function start() {
    $('startOv').hidden = true; $('overOv').hidden = true;
    reset(); state = 'play';
  }

  cv.addEventListener('pointerdown', e => { e.preventDefault(); drop(); });
  window.addEventListener('keydown', e => {
    if (e.target && e.target.tagName === 'INPUT') return;           // typing a nickname
    if (!$('nameOv').hidden) return;
    if (!$('rankOv').hidden) { if (['Escape', 'Space', 'Enter'].includes(e.code)) { e.preventDefault(); closeRanking(); } return; }
    if (e.code !== 'Space' && e.code !== 'Enter') return;
    e.preventDefault();
    if (state === 'play') drop();
    else if (state === 'over' && !$('overOv').hidden) start();
    else if (state === 'idle') start();
  });
  $('startBtn').addEventListener('click', start);
  $('retryBtn').addEventListener('click', start);

  resize(); reset(); state = 'idle';
  loop();
})();
</script>
</body>
</html>
